################################################################################
## M2FittsRobotHumanMachine - run-time configuration (Block 2: shared control)
##
## Searched in this order, relative to the folder CORC is started from:
##     config/M2FittsRobotHuman.conf, config/M2FittsRobotHumanMachine.cfg,
##     ../config/M2FittsRobotHuman.conf, ../config/M2FittsRobotHumanMachine.cfg,
##     <CORC source>/config/M2FittsRobotHumanMachine.cfg
## Every line is "key = value"; '#', '//' and ';' start an in-line comment.
## Any key left out keeps its built-in default (shown in brackets).
## Lengths in m, times in s, forces in N. Nothing here requires recompiling.
##
## Everything from "Session" to "Design structure" has the meaning it has in
## M2FittsHumanMachine.cfg and is set to the Block 1 values. Keep the two files
## in step: the intended differences between the blocks are the shared reach and
## the absence of a warm-up in Block 2 (warmup_* keys are not read by this app).
################################################################################

## --- Session -----------------------------------------------------------------
participant      = P01                  # output file names and csv                     [P00]
block            = 2                    # sent to the display, which shows "BLOCK 2"    [2]
trials_dir       = ../schedule/   # <trials_prefix>1..n_rounds.csv WITH an 'alpha' column
                                        # {participant} is replaced by the participant id, so each
                                        # participant's alpha table sits in its own folder  [../schedule]
trials_prefix    = bal_group_           #                                               [bal_group_]
results_dir      = ../logs              # must exist before starting                    [../logs]
robot_name       = M2_MELB              #                                               [M2_MELB]
#robot_config    = ../config/M2FittsMachine.yaml   # robot-alone config holding the PD (u_r).
                                        # Default: searched in config/, ../config/ and <CORC source>/config/

## --- Unity / FLNL (Block 1 protocol, unchanged) --------------------------------
bind_ip          = 0.0.0.0              # local address the FLNL server binds to        [0.0.0.0]
                                        # (Block 1 always bound 0.0.0.0, whatever its 'ip' key said)
port             = 2048                 #                                               [2048]
ui_required      = true                 # hold in WaitUI until the client has sent HELO [true]
ui_stream_divider = 2                   # 1 frame every N control cycles (250 Hz)       [2]
display_gain     = 1.0                  # MUST stay 1.0 (see M2FittsHumanMachine.cfg)   [1.0]

## --- Task geometry (Block 1 values) ---------------------------------------------
origin_x         = 0.40                 #                                               [0.40]
origin_y         = 0.10                 #                                               [0.20]
task_direction   = -1                   #                                               [-1]
use_y_channel    = true                 # virtual channel making the task 1D            [true]
channel_k        = 2000                 # [N/m]                                         [800]
channel_d        = 125                  # [N/(m/s)]                                     [10]
channel_f_max    = 30                   # [N], used only if channel_saturate = true     [30]
channel_saturate = false                # Block 1 never applied channel_f_max (its saturated value is computed
                                        # after the force is sent). false keeps the channel identical across
                                        # blocks; set true only if Block 1 is fixed the same way      [false]

## --- Trial (Block 1 values) -------------------------------------------------------
dwell_time       = 1.0                  #                                               [1.0]
home_exit_radius = 0.005                #                                               [0.005]
max_trial_time   = 15.0                 #                                               [15.0]
success_hold_time = 0.5                 #                                               [0.5]
force_limit_time = 0.10                 # also debounces reach_force_limit below        [0.10]
force_grace_time = 0.15                 #                                               [0.15]

## --- Return to the origin (Block 1 values) ---------------------------------------
return_offset    = 0.03                 #                                               [0.03]
return_speed     = 0.10                 #                                               [0.20]
return_min_time  = 0.8                  #                                               [0.8]
origin_tolerance = 0.005                #                                               [0.005]
max_return_time  = 10.0                 #                                               [5.0]
origin_snap_time = 0.4                  #                                               [0.4]
origin_hold_time = 1.0                  #                                               [0.25]
origin_settle_speed = 0.03              #                                               [0.03]
origin_settle_time  = 0.15              #                                               [0.15]

## --- Breaks (Block 1 values) ------------------------------------------------------
round_break_time = 60                   #                                               [60]
ready_hold_time  = 2.0                  #                                               [2.0]

## --- Robot-driven moves outside the reach (Block 1 values) ------------------------
k_pos_vel        = 3.0                  #                                               [1.0]
force_limit      = 30                   #                                               [30]
k_hold           = 8.0                  #                                               [8.0]
away_tolerance   = 0.002                #                                               [0.002]
away_settle_speed = 0.02                #                                               [0.02]
max_move_extra_time = 1.0               #                                               [1.0]

## --- Design structure (Block 1 values) ----------------------------------------
n_rounds         = 4                    #                                               [4]
trials_per_round = 45                   #                                               [45]

## --- Block 2: shared-control law  u = alpha*u_r + (1-alpha)*u_h -----------------
## Task axis: F_cmd,x = alpha*F_pd,x - alpha*k_h*F_h,x  (FittsSharedControl.h).
## The PD (u_r) is ALWAYS read from the robot-alone configuration (M2FittsMachine.yaml).
alpha_override   = -1                   # < 0: alpha from the csv (normal use). In [0, 1]: EVERY trial uses
                                        # this value - commissioning only (0 ~ Block 1, 1 ~ robot alone);
                                        # output files are then tagged _alphaOVR       [-1]
human_force_sign = -1                   # F_h = sign * F_int. -1: in the Block 1 logs F_int is anti-correlated
                                        # with velocity during transparent reaching. A wrong sign turns the
                                        # cancellation into positive feedback: verify before any participant [-1]
human_force_filter_hz = 0               # low-pass on F_int before cancelling, 0 = raw (RobotM2 uses raw) [0]
platform_assist_gain = 0.2              # gamma*blend in RobotM2::setEndEffForceWithCompensation   [0.2]
platform_assist_force_threshold = 0.05  # threshold_f in that function [N]              [0.05]
platform_assist_velocity_threshold = 0.05   # threshold_v in that function [m/s]        [0.05]
                                        # The three values above MUST mirror RobotM2.cpp. Set the gain to 0 to
                                        # define u_h as the bare human force.
cancel_f_max     = 30                   # cap on |alpha*k_h*F_h,x| [N]                  [30]
command_f_max    = 50                   # cap on |F_cmd,x| [N]; RobotM2 disables at 80 N interaction force [50]

## --- Block 2: safety of the shared reach -----------------------------------------
reach_force_limit = 40                  # |F_int| above this for force_limit_time: robot released and the
                                        # trial scored as a miss (reach_abort = 1); 0 = off   [40]
max_speed        = 1.5                  # above this -> FaultState (damping brake) [m/s] [1.5]
workspace_tolerance = 0.01              # excursion beyond the M2 travel -> FaultState [m] [0.01]
brake_damping    = 40                   # FaultState damping [N/(m/s)]                  [40]
brake_f_max      = 30                   # FaultState force cap [N]                      [30]
conflict_threshold = 1.0                # |force| above which a push counts in conflict_frac [N] [1.0]