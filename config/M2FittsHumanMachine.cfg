################################################################################
## M2FittsHumanMachine - run-time configuration
##
## Searched in this order, relative to the folder CORC is started from:
##     config/M2FittsHuman.conf
##     config/M2FittsHumanMachine.cfg
##     ../config/M2FittsHuman.conf
##     ../config/M2FittsHumanMachine.cfg
## Every line is "key = value"; '#' starts a comment (in-line comments are stripped).
## Any key left out keeps its built-in default (shown in brackets).
## Lengths are in m, times in s. Nothing here requires recompiling.
################################################################################

## --- Session -----------------------------------------------------------------
participant      = P01                  # used in the output file names and in the csv   [P00]
block            = 1                    # logged as-is; this app implements Block 1 only [1]
trials_dir       = ../schedule          # bal_group_1..4.csv + warmup.csv                [../schedule]
results_dir      = ../logs              # must exist before starting                     [../logs]
robot_name       = M2_MELB              # robot name passed to RobotM2()                 [M2_MELB]

## --- Unity / FLNL ------------------------------------------------------------
ip               = 169.254.105.3        # LOCAL address the FLNL server binds to         [169.254.105.3]
port             = 2048                 #                                                [2048]
ui_required      = true                 # hold in WaitUI until the client has sent HELO  [true]
                                        # set false only for bench testing without a display
ui_stream_divider = 2                   # stream 1 frame every N control cycles          [2]
                                        # 2 -> 250 Hz at a 500 Hz loop. Raise it if the
                                        # client machine cannot keep up; the 500 Hz record
                                        # in *_raw.csv is unaffected.
display_gain     = 1.0                  # robot metre -> scene metre. MUST stay 1.0       [1.0]
                                        # unless a visuomotor gain manipulation is intended:
                                        # any other value makes the visual ID differ from
                                        # the mechanical one.

## --- Task geometry (M2 workspace: x in [0, 0.625] m, y in [0, 0.440] m) -------
origin_x         = 0.40                 # start (home) position                          [0.40]
origin_y         = 0.20                 #                                                [0.20]
task_direction   = -1                   # +1: targets at increasing x, -1: decreasing    [-1]
use_y_channel    = true                 # virtual channel making the task 1D             [true]
channel_k        = 800                  # channel stiffness [N/m]                        [800]
channel_d        = 10                   # channel damping [N/(m/s)]                      [10]

## --- Trial -------------------------------------------------------------------
dwell_time       = 1.0                  # dwell validating the capture (excluded from MT) [1.0]
home_exit_radius = 0.005                # movement onset threshold (for RT)              [0.005]
max_trial_time   = 10.0                 # trial time-out -> success = 0                  [10.0]

## --- Return to the origin after each trial -----------------------------------
return_offset    = 0.03                 # robot drives the handle 3 cm off the origin    [0.03]
return_speed     = 0.20                 # mean speed of robot-driven moves [m/s]         [0.20]
return_min_time  = 0.8                  # minimum duration of a robot-driven move        [0.8]
origin_tolerance = 0.005                # participant must return within 0.5 cm          [0.005]
max_return_time  = 5.0                  # cap on the self-paced inter-trial rest         [5.0]
origin_snap_time = 0.4                  # final robot move onto the exact origin         [0.4]
origin_hold_time = 0.25                 # hold on the origin before the next target      [0.25]

## --- Breaks ------------------------------------------------------------------
round_break_time = 60                   # after each round of 45 trials                  [60]
warmup_rest_time = 60                   # between warm-up and Block 1                    [60]
ready_hold_time  = 2.0                  # hold at the origin before auto-resuming        [2.0]

## --- Control / safety --------------------------------------------------------
k_pos_vel        = 1.0                  # gain of the position-over-velocity loop        [1.0]
force_limit      = 30                   # abort robot-driven moves above this [N], 0 = off [30]

## --- Design structure (checked against the csv files at load) ----------------
n_rounds         = 4                    #                                                [4]
trials_per_round = 45                   #                                                [45]
warmup_repeats   = 2                    # warm-up rounds, each covering the 5 IDs once   [2]
