# Configuration of the M2FittsMachine CORC app.
# Lengths in metres, speeds in m/s, forces in N, times in s (unless stated otherwise).
# Unknown keys are rejected at start-up, so a typo cannot silently fall back to a default.
# Gains and limits below are COMMISSIONING VALUES FOR TUNING, not validated values for your M2.

M2FittsMachine:
  trials:
    file: "/home/nle/Fitts/CANOpenRobotController/schedule/bal_group_all.csv"   # in CORC's config/ folder (or an absolute path)
    d_column: "B"               # spreadsheet column holding displacement D
    w_column: "C"               # spreadsheet column holding target width W  (set "W" if W is really in column W)
    units_to_m: 0.01            # file values are in cm
    expected_rows: 180          # abort if the file holds a different number of trials (0 = no check)
    start_trial: 1              # 1-based; set > 1 to resume an interrupted block

  task:
    home: [0.40, 0.10]          # start/return position; y is held at 0.20 throughout
    direction: -1               # targets at x = 0.40 - D
    tolerance_factor: 0.5       # success band |x - x_target| <= 0.5 * W
    dwell_time: 1.0             # continuous time inside the band required for success
    acquisition_timeout: 5.0    # trial fails if outside the band at/after this time
    onset_speed: 0.01           # |dx| threshold defining kinematic onset

  home_settling:
    tolerance: 0.005            # "at home" radius
    rest_speed: 0.005           # "at rest" speed
    rest_time: 0.5              # continuous rest at home before the next trial starts
    settle_timeout: 10.0        # extra time to settle before the block pauses with a warning
    return_ref_speed: 0.10      # reference speed of the return movement (0 = step, like the trials)
    homing_ref_speed: 0.10      # reference speed from the calibration corner to home (must be > 0)

  pd:
    kp: [1400.0, 3200.0]          # N/m   [x, y] 1400
    kd: [100.0, 100.0]            # N.s/m [x, y] 125
    f_max: 30.0                 # per-axis saturation of the PD force (commissioning value)
    velocity_filter_hz: 30.0     # low-pass cut-off on measured velocity for the D term (0 = off)
    friction_compensation: true  # false = pure PD; true = PD + RobotM2 friction feedforward
    stiction_comp: [3.0, 0.0]               # breakaway force added to the robot term (x alpha) while the handle is stuck
                                        # away from the target centre. RobotM2 compensates friction only above
                                        # 5 cm/s, so the PD spring can stall short of small targets. 0 = off.
                                        # Tune: raise until the robot enters W = 0.5 cm at high alpha without
                                        # hunting around the centre                              [0]
    stiction_rest_speed: 0.01              # the handle counts as stuck below this speed [m/s]     [0.01]
    stiction_deadband: 0.0005            # no compensation within this distance of the centre [m] [0.0005]

  safety:
    max_speed: 1.5            # app-level speed limit -> FaultState (RobotM2 itself disables at 3 m/s)
    workspace_x: [0.0, 0.625]   # x range defined in RobotM2 (CORC)
    workspace_y: [0.0, 0.440]   # y range defined in RobotM2 (CORC)
    workspace_tolerance: 0.01   # allowed excursion outside the range before a fault
    target_margin: 0.02         # minimum clearance between any target band and the range ends
    brake_damping: 40.0         # damping used to stop the robot in FaultState

  calibration:                  # homing against the lower mechanical stops (values as in CORC's M2DemoMachine)
    force: 20.0
    damping: 3.0
    still_speed: 0.005
    still_time: 1.0

  logging:
    folder: "../logs"              # relative to the folder the app is launched from
